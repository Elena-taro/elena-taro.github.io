    // ============ ЛОГИКА ============
    const dayNames = ["ПН", "ВТ", "СР", "ЧТ", "ПТ", "СБ", "ВС"];

    function getRandomCard() {
        return cards[Math.floor(Math.random() * cards.length)];
    }

    function getRandomCards(count) {
        const shuffled = [...cards].sort(() => Math.random() - 0.5);
        return shuffled.slice(0, count);
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function goHome() {
        showScreen('mainScreen');
    }

    // Карта дня
    function showCardOfDay() {
        const container = document.getElementById('cardContainer');
        container.innerHTML = `
            <div class="shuffle-animation">
                <span class="emoji">🔮</span>
                Карты перемешиваются...
            </div>
        `;
        showScreen('cardScreen');

        setTimeout(() => {
            const card = getRandomCard();
            container.innerHTML = `
                <div class="result-card">
                    <div class="card-name">${card.name}</div>
                    <div class="card-section plus">
                        <div class="section-label">В плюсе</div>
                        <div class="section-text">${card.plus}</div>
                    </div>
                    <div class="card-section minus">
                        <div class="section-label">В минусе</div>
                        <div class="section-text">${card.minus}</div>
                    </div>
                    <div class="card-section advice">
                        <div class="section-label">Совет</div>
                        <div class="section-text">${card.advice}</div>
                    </div>
                </div>
            `;
        }, 1200);
    }

    // Расклад на неделю
    function showWeekSpread() {
        const container = document.getElementById('weekContainer');
        container.innerHTML = `
            <div class="shuffle-animation">
                <span class="emoji">📅</span>
                Готовим расклад на неделю...
            </div>
        `;
        showScreen('weekScreen');

        setTimeout(() => {
            const weekCards = getRandomCards(7);
            let html = '<div class="week-grid">';
            weekCards.forEach((card, index) => {
                html += `
                    <div class="day-card">
                        <div class="day-name">${dayNames[index]}</div>
                        <div class="day-content">
                            <div class="day-card-name">${card.name}</div>
                            <div class="day-advice">${card.advice}</div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }, 1200);
    }

    // Карта совет
    function showAdvice() {
        const container = document.getElementById('adviceContainer');
        container.innerHTML = `
            <div class="shuffle-animation">
