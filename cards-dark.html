    function getRandomCard() {
        return cards[Math.floor(Math.random() * cards.length)];
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function goHome() { showScreen('mainScreen'); }

    function showCardOfDay() {
        document.getElementById('cardContent').innerHTML = `
            <div class="card-back" onclick="openCard()">
                <div class="moon">🌙</div>
                <div class="open-text">Открыть карту дня</div>
            </div>
        `;
        showScreen('cardScreen');
    }

    function openCard() {
        const card = getRandomCard();
        document.getElementById('cardContent').innerHTML = `
            <div class="card-open">
                <div class="card-title">${card.name}</div>
                <div class="card-meaning">${card.short}</div>
                <div class="card-block">
                    <div class="block-label">Совет</div>
                    <div class="block-text">${card.advice}</div>
                </div>
                <div class="nav-buttons">
                    <button class="btn-primary" onclick="showCardOfDay()">🔄 Ещё карту</button>
                </div>
            </div>
        `;
    }

    function showQuestion() {
        document.getElementById('questionContent').innerHTML = `
            <div class="card-title" style="font-size:1.4rem;">Задай свой вопрос</div>
            <p style="color:#8a7ba0; font-size:0.85rem; margin-bottom:20px;">Напиши, что тебя волнует — карты дадут ответ</p>
            <div class="question-field">
                <textarea id="userQuestion" placeholder="О чём ты хочешь спросить?"></textarea>
            </div>
            <div class="nav-buttons">
                <button class="btn-primary" onclick="getAnswer()">🔮 Получить ответ</button>
            </div>
        `;
        showScreen('questionScreen');
    }

    function getAnswer() {
        const question = document.getElementById('userQuestion').value.trim();
        const card = getRandomCard();
        const questionText = question ? `<p style="color:#8a7ba0; font-size:0.85rem; margin-bottom:16px; font-style:italic;">Твой вопрос: «${question}»</p>` : '';
        document.getElementById('questionContent').innerHTML = `
            <div class="card-open">
                ${questionText}
                <div class="card-title">${card.name}</div>
                <div class="card-meaning">${card.short}</div>
                <div class="card-block">
                    <div class="block-label">Совет</div>
                    <div class="block-text">${card.advice}</div>
                </div>
                <div class="nav-buttons">
                    <button class="btn-primary" onclick="showQuestion()">🔄 Задать новый вопрос</button>
                </div>
            </div>
        `;
    }

    function showAdvice() {
        const card = getRandomCard();
        document.getElementById('adviceContainer').innerHTML = `
            <div class="card-open">
                <div class="card-title">${card.name}</div>
                <div class="card-meaning">${card.short}</div>
                <div class="card-block">
                    <div class="block-label">Совет</div>
                    <div class="block-text">${card.advice}</div>
                </div>
            </div>
        `;
        showScreen('adviceScreen');
    }
</script>
