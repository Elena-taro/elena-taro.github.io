            left: -20%;

            height: 140%;

            left: -100%;

            height: 100%;

            left: -50%;

    const dayNames = ["ПН", "ВТ", "СР", "ЧТ", "ПТ", "СБ", "ВС"];

    let readingsLeft = 3;

    function initCounter() {
        const today = new Date().toDateString();
        const saved = localStorage.getItem('tarotDate');
        const savedCount = localStorage.getItem('tarotCount');
        if (saved !== today) {
            readingsLeft = 3;
            localStorage.setItem('tarotDate', today);
            localStorage.setItem('tarotCount', '3');
        } else {
            readingsLeft = parseInt(savedCount) || 0;
        }
        updateCounter();
    }

    function updateCounter() {
        document.getElementById('counterValue').textContent = readingsLeft;
    }

    function useReading() {
        if (readingsLeft <= 0) {
            alert('На сегодня расклады закончились. Приходи завтра!');
            return false;
        }
        readingsLeft--;
        localStorage.setItem('tarotCount', readingsLeft);
        updateCounter();
        return true;
    }

    function getRandomCard() {
        return cards[Math.floor(Math.random() * cards.length)];
    }

    function getRandomCards(count) {
        const shuffled = [...cards].sort(() => Math.random() - 0.5);
        return shuffled.slice(0, count);
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function goHome() {
        showScreen('mainScreen');
    }

    function showCardOfDay() {
        const container = document.getElementById('cardContent');
        container.innerHTML = `
            <div class="card-back" onclick="openCard()">
                <div class="moon">🌙</div>
                <div class="open-text">Открыть карту дня</div>
            </div>
        `;
        showScreen('cardScreen');
    }

    function openCard() {
        if (!useReading()) return;
        const card = getRandomCard();
        const container = document.getElementById('cardContent');
        container.innerHTML = `
            <div class="card-open">
                <div class="card-title">${card.name}</div>
                <div class="card-block">
                    <div class="block-label plus">В плюсе</div>
                    <div class="block-text">${card.plus}</div>
                </div>
                <div class="card-block">
                    <div class="block-label minus">В минусе</div>
                    <div class="block-text">${card.minus}</div>
                </div>
                <div class="nav-buttons">
                    <button class="btn-primary" onclick="showCardOfDay()">🔄 Ещё карту</button>
                </div>
            </div>
        `;
    }

    function showWeekSpread() {
        if (!useReading()) return;
        const container = document.getElementById('weekContainer');
        const weekCards = getRandomCards(7);
        let html = '<div class="week-grid">';
        weekCards.forEach((card, index) => {
            html += `
                <div class="day-card">
                    <div class="day-name">${dayNames[index]}</div>
                    <div>
                        <div class="day-card-name">${card.name}</div>
                        <div class="day-advice">${card.advice}</div>
                    </div>
                </div>
            `;
        });
        html += '</div>';
        container.innerHTML = html;
        showScreen('weekScreen');
    }

    function showAdvice() {
        if (!useReading()) return;
        const container = document.getElementById('adviceContainer');
        const card = getRandomCard();
        container.innerHTML = `
            <div class="card-open">
                <div class="card-title">${card.name}</div>
                <div class="card-block">
                    <div class="block-label advice">Совет</div>
                    <div class="block-text">${card.advice}</div>
                </div>
            </div>
        `;
        showScreen('adviceScreen');
    }

    initCounter();
</script>
