            position: relative;
            overflow: hidden;
        }

            content: '';
            position: absolute;
            top: -50%;
            left: -50%;

            height: 200%;

            color: #e0c8f0;

            to { transform: rotateY(0deg); opacity: 1; }

</head>

        { name: "5 Мечей", plus: "Честность с собой, осознание поражения.", minus: "Конфликт, победа любой ценой, чувство вины.", advice: "Победа не всегда оправдана. Спросите себя, стоила ли она того." },
        { name: "6 Мечей", plus: "Переход к лучшему, уход от проблем, покой.", minus: "Побег от проблем, страх перемен.", advice: "Двигайтесь к лучшему, но не убегайте от себя." },
        { name: "7 Мечей", plus: "Стратегия, хитрость, защита интересов.", minus: "Обман, нечестность, избегание ответственности.", advice: "Вы умнее, чем кажется. Используйте это честно." },
        { name: "8 Мечей", plus: "Осознание ограничений, поиск выхода.", minus: "Ограничения, страх, самоизоляция.", advice: "Вы не в ловушке — это ваши страхи удерживают вас." },
        { name: "9 Мечей", plus: "Принятие страха, поиск опоры.", minus: "Тревога, ночные кошмары, самобичевание.", advice: "Ваши страхи — это всего лишь мысли. Не верьте им." },
        { name: "10 Мечей", plus: "Освобождение от долгого страдания.", minus: "Полный крах, депрессия, ощущение безнадёжности.", advice: "Это дно. И единственный путь отсюда — вверх." },
        { name: "Паж Мечей", plus: "Острый ум, внимание к деталям, поиск истины.", minus: "Излишняя критика, недоверие, ирония.", advice: "Ищите истину, но не раните других своей правдой." },
        { name: "Рыцарь Мечей", plus: "Быстрота, решимость, уверенность.", minus: "Агрессия, поспешность, резкость.", advice: "Действуйте быстро, но не перерезайте себе путь." },
        { name: "Королева Мечей", plus: "Ясность ума, прямота, справедливость.", minus: "Холод, излишняя критичность.", advice: "Будьте честны, но с теплом." },
        { name: "Король Мечей", plus: "Интеллект, власть, авторитет, решения.", minus: "Деспотизм, высокомерие, давление.", advice: "Управляйте с мудростью, а не с превосходством." },
        { name: "Туз Пентаклей", plus: "Финансовый старт, ресурсы, стабильность.", minus: "Неумение пользоваться ресурсами, страх денег.", advice: "Возьмите своё — но знайте, куда это применить." },
        { name: "2 Пентаклей", plus: "Гибкость, баланс доходов, распределение.", minus: "Нестабильность, метания, неумение планировать.", advice: "Управляйте потоками, чтобы они не управляли вами." },
        { name: "3 Пентаклей", plus: "Командная работа, сотрудничество, реализация.", minus: "Работа в одиночку, недоверие к другим.", advice: "Делайте своё дело, но не отказывайтесь от помощи." },
        { name: "4 Пентаклей", plus: "Стабильность, накопление, уверенность.", minus: "Жадность, страх потерь, закрытость.", advice: "Сохраняйте, но не становитесь рабом накоплений." },
        { name: "5 Пентаклей", plus: "Поиск выхода, принятие помощи.", minus: "Бедность, чувство ущербности, отчаяние.", advice: "Вы не одиноки — даже если кажется иначе." },
        { name: "6 Пентаклей", plus: "Щедрость, помощь, взаимность.", minus: "Зависимость от других, чувство вины.", advice: "Умейте и давать, и брать без стыда." },
        { name: "7 Пентаклей", plus: "Терпение, ожидание результата, оценка.", minus: "Нетерпение, сомнение в плодах.", advice: "Ваши семена дадут плоды — дайте им время." },
        { name: "8 Пентаклей", plus: "Упорный труд, мастерство, развитие.", minus: "Зацикленность на процессе, выгорание.", advice: "Работайте усердно, но не теряйте радость." },
        { name: "9 Пентаклей", plus: "Финансовая независимость, комфорт.", minus: "Гордыня, оторванность от других.", advice: "Наслаждайтесь свободой, но делитесь теплом." },
        { name: "10 Пентаклей", plus: "Наследие, семейные финансы, стабильность.", minus: "Конфликты из-за наследства, материализм.", advice: "Ваше наследие — это не только деньги." },
        { name: "Паж Пентаклей", plus: "Планирование, практичность, обучение.", minus: "Несерьёзность, отсутствие целей.", advice: "Учитесь и практикуйтесь — это ваш фундамент." },
        { name: "Рыцарь Пентаклей", plus: "Ответственность, упорство, надёжность.", minus: "Медлительность, консерватизм, скука.", advice: "Двигайтесь вперёд, даже если шаг маленький." },
        { name: "Королева Пентаклей", plus: "Заботливость, практичность, уют, ресурсы.", minus: "Гиперопека, материализм, страх бедности.", advice: "Создавайте тёплый дом и финансы, но не забывайте о себе." },
        { name: "Король Пентаклей", plus: "Стабильность, управление ресурсами, процветание.", minus: "Жадность, консерватизм, властность.", advice: "Стройте империю, но помните, что главное — не только деньги." }
    ];

    const dayNames = ["ПН", "ВТ", "СР", "ЧТ", "ПТ", "СБ", "ВС"];
    const sphereNames = ["Работа и деньги", "Отношения", "Общий вайб недели"];
    const sphereKeys = ["plus", "minus", "advice"];

    let readingsLeft = 3;
    let currentTab = 'card';

    // Проверка счётчика
    function initCounter() {
        const today = new Date().toDateString();
        const saved = localStorage.getItem('tarotDate');
        const savedCount = localStorage.getItem('tarotCount');
        if (saved !== today) {
            readingsLeft = 3;
            localStorage.setItem('tarotDate', today);
            localStorage.setItem('tarotCount', '3');
        } else {
            readingsLeft = parseInt(savedCount) || 0;
        }
        updateCounter();
    }

    function updateCounter() {
        document.getElementById('counterValue').textContent = readingsLeft;
    }

    function useReading() {
        if (readingsLeft <= 0) {
            alert('На сегодня расклады закончились. Приходи завтра!');
            return false;
        }
        readingsLeft--;
        localStorage.setItem('tarotCount', readingsLeft);
        updateCounter();
        return true;
    }

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelector(`.tab[onclick*="${tab}"]`).classList.add('active');
        document.getElementById('screen-' + tab).classList.add('active');
    }

    function getRandomCard() {
        return cards[Math.floor(Math.random() * cards.length)];
    }

    function getRandomCards(count) {
        const shuffled = [...cards].sort(() => Math.random() - 0.5);
        return shuffled.slice(0, count);
    }

    // Карта дня
    function openCard() {
        if (!useReading()) return;
        const card = getRandomCard();
        const container = document.getElementById('cardContent');
        container.innerHTML = `
            <div class="card-open">
                <div class="card-title">${card.name}</div>
                <div class="card-block">
                    <div class="block-label plus">В плюсе</div>
                    <div class="block-text">${card.plus}</div>
                </div>
                <div class="card-block">
                    <div class="block-label minus">В минусе</div>
                    <div class="block-text">${card.minus}</div>
                </div>
                <div class="nav-buttons">
                    <button class="btn-primary" onclick="resetCard()">🔄 Ещё карту</button>
                </div>
            </div>
        `;
    }

    function resetCard() {
        document.getElementById('cardContent').innerHTML = `
            <div class="card-back" onclick="openCard()">
                <div class="moon">🌙</div>
                <div class="open-text">Открыть карту дня</div>
            </div>
        `;
    }

    // Расклад по сферам
    function makeSpread() {
        if (!useReading()) return;
        const result = getRandomCards(3);
        const plans = document.getElementById('plansInput').value.trim();
        let html = '';
        result.forEach((card, i) => {
            const field = sphereKeys[i];
            html += `
                <div class="sphere-card">
                    <div class="sphere-title">${sphereNames[i]}</div>
                    <div class="sphere-card-name">${card.name}</div>
                    <div class="sphere-text">${card[field]}</div>
                </div>
            `;
        });
        if (plans) {
            html += `<p style="color:#d0b8e0; font-size:0.85rem; margin-top:12px; font-style:italic;">С учётом ваших планов: «${plans}» — карты советуют обратить внимание на эти сферы.</p>`;
        }
        document.getElementById('sphereResult').innerHTML = html;
    }

    // Неделя
    function makeWeek() {
        if (!useReading()) return;
        const weekCards = getRandomCards(7);
        let html = '<div class="week-grid">';
        weekCards.forEach((card, index) => {
            html += `
                <div class="day-card">
                    <div class="day-name">${dayNames[index]}</div>
                    <div>
                        <div class="day-card-name">${card.name}</div>
                        <div class="day-advice">${card.advice}</div>
                    </div>
                </div>
            `;
        });
        html += '</div>';
        document.getElementById('weekResult').innerHTML = html;
    }

    // Инициализация
    initCounter();
</script>
</body>
